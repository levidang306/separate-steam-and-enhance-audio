name: quality

# Every pipeline change runs the same three checks: lint, the unit and
# integration tests, and the quality gate. The gate is separate because it
# answers a different question -- the tests ask whether the code does what it
# says, the gate asks whether the audio coming out is still at least as good as
# the audio going in.
#
# A failure here is not advisory. Clean input being modified, or the reference
# guitar regressing, means the change is not safe to ship even if every unit
# test passes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Only what the engine and its tests need. The restoration models --
          # audio-separator, Apollo, beat_this -- are V3-image-only and are not
          # installed here: the tests substitute stand-ins that reproduce their
          # measured behaviour, so CI never pulls a gigabyte of checkpoints.
          pip install numpy scipy librosa soxr soundfile pytest ruff

      - name: Lint
        run: ruff check suno_restore tests scripts

      - name: Tests
        run: pytest tests -q

      - name: Quality gate
        run: python scripts/quality_gate.py
